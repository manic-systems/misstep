[package]
name = "misstep"
version = "0.2.1"
edition = "2024"
rust-version = "1.95.0"
description = "Rust error reports with compile-time-selected formatting"
license = "EUPL-1.2"
repository = "https://git.notashelf.dev/notashelf/misstep"
keywords = [
  "error",
  "error-handling",
  "error-reporting",
  "backtrace",
  "tracing",
]
categories = ["rust-patterns"]
autobins = false
readme = true


[features]
default    = []
color      = ["dep:yansi"]
backtrace  = []
spantrace  = ["dep:tracing-error"]
pretty     = []
panic-hook = []

[dependencies]
yansi         = { version = "1.0.1", default-features = false, optional = true }
tracing-error = { version = "0.2.1", default-features = false, optional = true }

[dev-dependencies]
criterion  = "0.8.2"
color-eyre = { version = "0.6.5", default-features = false }

[lints.rust]
unknown_lints = "allow"

[lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction                      = { level = "warn", priority = -1 }

arbitrary_source_item_ordering  = "allow"
arithmetic_side_effects         = "allow"
else_if_without_else            = "allow"
error_impl_error                = "allow"
exhaustive_enums                = "allow"
exhaustive_structs              = "allow"
implicit_return                 = "allow"
indexing_slicing                = "allow"
inline_modules                  = "allow"
integer_division                = "allow"
integer_division_remainder_used = "allow"
missing_trait_methods           = "allow"
module_name_repetitions         = "allow"
pub_with_shorthand              = "allow"
question_mark_used              = "allow"
ref_patterns                    = "allow"
rest_pat_in_fully_bound_structs = "allow"
rest_pattern_accessible_field   = "allow"
separated_literal_suffix        = "allow"
single_call_fn                  = "allow"
std_instead_of_alloc            = "allow"
std_instead_of_core             = "allow"
tests_outside_test_module       = "allow"
