name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest]
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      os: ${{ matrix.os }}
      flake-check: false
      fmt: ${{ matrix.os == 'ubuntu-latest' }}
      fmt-command: cargo fmt --all --check && taplo fmt --check
      clippy: true
      clippy-command: >-
        cargo clippy --locked --all-targets -- -D warnings &&
        cargo clippy --locked --all-targets --no-default-features -- -D warnings &&
        cargo clippy --locked --all-targets --all-features -- -D warnings
      test: true
      test-command: >-
        cargo test --locked &&
        cargo test --locked --all-features

  msrv:
    name: MSRV
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      os: ubuntu-latest
      install-nix: false
      flake-check: false
      rust-toolchain: 1.95.0
      test: true
      test-command: cargo test --locked --all-features

  miri:
    name: Miri
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      os: ubuntu-latest
      install-nix: false
      flake-check: false
      rust-toolchain: nightly
      test: true
      test-command: >-
        rustup component add miri rust-src &&
        cargo miri test --locked --all-features

  coverage:
    name: Coverage
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      os: ubuntu-latest
      flake-check: false
      rust-toolchain: nightly
      setup-command: rustup component add llvm-tools-preview
      test: true
      test-command: nix shell nixpkgs#cargo-llvm-cov nixpkgs#nushell --command nu scripts/coverage.nu

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2

  required:
    name: Required Checks
    if: always()
    needs:
      - checks
      - msrv
      - miri
      - coverage
      - actions
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
